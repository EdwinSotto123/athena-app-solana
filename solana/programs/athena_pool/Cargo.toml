[package]
name = "athena_pool"
version = "0.1.0"
description = "Athena multi-case donation pool — Solana port of AthenaPool.sol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "athena_pool"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
